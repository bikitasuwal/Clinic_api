services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: clinic_project/Dockerfile

    command: >
      sh -c "
      echo 'Waiting for postgres...' &&
      sleep 10 &&
      python clinic_project/manage.py migrate &&
      python clinic_project/manage.py runserver 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env

  frontend:
    build:
      context: ./clinic-frontend
    ports:
      - "5173:5173"